[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age-pq.key"
TALOSCONFIG = "{{config_root}}/kubernetes/bootstrap/talos/clusterconfig/talosconfig"

[tasks.deps]
description = "Install dependencies"
run = "uv pip install -r requirements.txt"

[tools]
# Operations tools
# Pinned to the release that bundles Talos machinery v1.13.x to match the
# cluster's Talos version; 0.1.0-rc.2+ bundles v1.14 machinery, whose
# rendered configs are rejected by v1.13 nodes.
"ubi:mirceanton/talstomize" = "0.1.0-rc.1"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.5"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.53.1"
"aqua:helm/helm" = "4.3.0"
"aqua:helmfile/helmfile" = "1.8.0"
"aqua:jqlang/jq" = "1.7.1"
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:kubernetes/kubectl" = "1.36.1"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:siderolabs/talos" = "1.13.10"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:cilium/cilium-cli" = "0.20.0"
