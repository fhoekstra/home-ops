---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  render:
    desc: Render the Talos machine configurations to output/ (output contains secrets, never commit)
    dir: "{{.TALOS_DIR}}"
    cmd: topf render
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf sops

  nodes:
    desc: List the cluster nodes and their state
    dir: "{{.TALOS_DIR}}"
    cmd: topf nodes
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf

  apply:
    desc: Apply the Talos config to all nodes [NODE=<host> for a single node, MODE=auto|reboot|no-reboot|staged|try]
    dir: "{{.TALOS_DIR}}"
    cmd: topf apply {{.NODE_ARGS}} {{.MODE_ARGS}}
    vars:
      NODE_ARGS: '{{if .NODE}}--nodes-filter {{.NODE}}{{end}}'
      MODE_ARGS: '{{if .MODE}}--mode={{.MODE}}{{end}}'
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf

  upgrade:
    desc: Upgrade Talos on all nodes (or one node with NODE=<host>)
    dir: "{{.TALOS_DIR}}"
    cmd: topf upgrade {{.NODE_ARGS}}
    vars:
      NODE_ARGS: '{{if .NODE}}--nodes-filter {{.NODE}}{{end}}'
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf

  upgrade-k8s:
    desc: Upgrade Kubernetes
    dir: "{{.TALOS_DIR}}"
    cmd: talosctl upgrade-k8s --to '{{.KUBERNETES_VERSION}}'
    vars:
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/topf.yaml
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talosctl yq

  reset:
    desc: Resets nodes back to maintenance mode
    dir: "{{.TALOS_DIR}}"
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: topf reset --full=false --graceful=false
    preconditions:
      - which topf

  fetch-raw-disk-image-for-sbc:
    desc: Fetch the metal-arm64.raw disk image for the schematic that is referenced in topf.yaml from the Talos Image Factory API.
    dir: "{{.TALOS_DIR}}"
    cmds:
      - rm --force metal-arm64.raw metal-arm64.raw.xz
      - curl -L https://factory.talos.dev/image/{{ .SCHEMATIC_ID }}/{{ .TALOS_VERSION }}/metal-arm64.raw.xz --output metal-arm64.raw.xz
      - xz -d metal-arm64.raw.xz
    vars:
      SCHEMATIC_ID:
        sh: topf schematic-ids | head -1
      TALOS_VERSION:
        sh: yq '.talosVersion' {{.TALOS_DIR}}/topf.yaml
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which curl topf
