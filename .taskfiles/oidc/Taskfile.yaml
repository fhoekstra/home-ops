---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  AUTHELIA_IMAGE: "authelia/authelia:latest"
  OIDC_DIR: "{{.ROOT_DIR}}/kubernetes/apps/auth/authelia/oidc"
  RSIP_FILE: "{{.OIDC_DIR}}/rsip.yaml"

tasks:
  create-client:
    desc: Generate a new Authelia OIDC client, storing its credentials SOPS-encrypted and registering the patch [APP=required]
    silent: true
    env:
      APP: "{{.APP}}"
    cmds:
      - |
        set -euo pipefail

        if ! printf '%s' "${APP}" | grep -qE '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'; then
          echo "Error: APP must be lowercase alphanumeric (dashes allowed), got: ${APP}" >&2
          exit 1
        fi

        FILE="{{.OIDC_DIR}}/clients/client-${APP}.sops.yaml"
        KUSTOMIZATION="{{.OIDC_DIR}}/kustomization.yaml"
        PATCH_PATH="./clients/client-${APP}.sops.yaml"

        if test -e "${FILE}"; then
          echo "Error: ${FILE} already exists" >&2
          exit 1
        fi

        echo "Generating OIDC client credentials for app: ${APP}"

        HASH="$(docker run --rm {{.AUTHELIA_IMAGE}} authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986)"
        SECRET="$(printf '%s\n' "${HASH}" | sed -n 's/^Random Password: //p')"
        DIGEST="$(printf '%s\n' "${HASH}" | sed -n 's/^Digest: //p')"

        ID="$(docker run --rm {{.AUTHELIA_IMAGE}} authelia crypto rand --length 72 --charset rfc3986 | sed -n 's/^Random Value: //p')"

        if test -z "${ID}" || test -z "${SECRET}" || test -z "${DIGEST}"; then
          echo "Error: could not parse authelia output" >&2
          exit 1
        fi
        export ID SECRET DIGEST

        {
          printf '# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json\n'
          yq -n '.apiVersion = "v1" | .kind = "Secret" | .metadata.name = "authelia-oidc-clients-credentials" | .stringData["clients." + strenv(APP) + ".client-id"] = strenv(ID) | .stringData["clients." + strenv(APP) + ".client-secret"] = strenv(SECRET) | .stringData["clients." + strenv(APP) + ".client-secret-digest"] = strenv(DIGEST)'
        } > "${FILE}"

        if ! yq -e '.stringData["clients." + strenv(APP) + ".client-id"] == strenv(ID) and .stringData["clients." + strenv(APP) + ".client-secret"] == strenv(SECRET) and .stringData["clients." + strenv(APP) + ".client-secret-digest"] == strenv(DIGEST)' "${FILE}" >/dev/null; then
          echo "Error: generated file does not match the generated credentials" >&2
          exit 1
        fi

        sops --encrypt --in-place "${FILE}"

        if yq '.patches.[].path' "${KUSTOMIZATION}" | grep -qF "${PATCH_PATH}"; then
          echo "Error: ${KUSTOMIZATION} already references ${PATCH_PATH}" >&2
          exit 1
        fi
        yq -i '.patches += {"path": "'"${PATCH_PATH}"'"}' "${KUSTOMIZATION}"

        if ! yq '.patches.[].path' "${KUSTOMIZATION}" | grep -qF "${PATCH_PATH}"; then
          echo "Error: failed to register ${PATCH_PATH} in ${KUSTOMIZATION}" >&2
          exit 1
        fi

        echo "Created ${FILE} and registered it in ${KUSTOMIZATION}"
        echo ""
        echo "Next, add the client to the registry in {{.RSIP_FILE}} (spec.defaultValues.clients):"
        cat <<EOF
        - app: ${APP}
          namespace: <namespace of the ${APP} application>
          client:
            client_name: <human readable name>
            redirect_uris:
              - https://<${APP} callback url>
            scopes:
              - openid
              - profile
              - groups
              - email
        EOF
        echo ""
        echo "Optional per-client fields: claims_policy / claims_policies / authorization_policy /"
        echo "any other Authelia OIDC client option (see the Authelia client documentation)."
        echo "Authelia picks everything up on the next reconciliation; the client credentials are"
        echo "synced to the application namespace automatically by the ResourceSet."
    requires:
      vars: [APP]
    preconditions: &client_preconditions
      - sh: which docker
        msg: "docker not found"
      - sh: which sops
        msg: "sops not found"
      - sh: which yq
        msg: "yq not found"
      - sh: test -f {{.ROOT_DIR}}/.sops.yaml
        msg: ".sops.yaml not found at {{.ROOT_DIR}}/.sops.yaml"
      - sh: test -f {{.SOPS_AGE_KEY_FILE}}
        msg: "AGE key file not found at {{.SOPS_AGE_KEY_FILE}}. Generate with: age-keygen -pq -o {{.SOPS_AGE_KEY_FILE}}"

  rotate-client:
    desc: Rotate the client secret of an existing Authelia OIDC client (client id is kept) [APP=required]
    silent: true
    env:
      APP: "{{.APP}}"
    cmds:
      - |
        set -euo pipefail

        if ! printf '%s' "${APP}" | grep -qE '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'; then
          echo "Error: APP must be lowercase alphanumeric (dashes allowed), got: ${APP}" >&2
          exit 1
        fi

        FILE="{{.OIDC_DIR}}/clients/client-${APP}.sops.yaml"

        if ! test -f "${FILE}"; then
          echo "Error: ${FILE} does not exist. Create it with: task oidc:create-client APP=${APP}" >&2
          exit 1
        fi

        if ! sops -d "${FILE}" | yq -e '.stringData["clients.'${APP}'.client-secret-digest"]' >/dev/null; then
          echo "Error: ${FILE} does not contain clients.${APP}.client-secret-digest" >&2
          exit 1
        fi

        echo "Rotating OIDC client secret for app: ${APP}"

        HASH="$(docker run --rm {{.AUTHELIA_IMAGE}} authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986)"
        SECRET="$(printf '%s\n' "${HASH}" | sed -n 's/^Random Password: //p')"
        DIGEST="$(printf '%s\n' "${HASH}" | sed -n 's/^Digest: //p')"

        if test -z "${SECRET}" || test -z "${DIGEST}"; then
          echo "Error: could not parse authelia output" >&2
          exit 1
        fi
        export SECRET DIGEST

        sops --set '["stringData"]["clients.'"${APP}"'.client-secret"] "'"${SECRET}"'"' "${FILE}"
        sops --set '["stringData"]["clients.'"${APP}"'.client-secret-digest"] "'"${DIGEST}"'"' "${FILE}"

        if ! sops -d "${FILE}" | yq -e '.stringData["clients.'${APP}'.client-secret-digest"] == strenv(DIGEST) and .stringData["clients.'${APP}'.client-secret"] == strenv(SECRET)' >/dev/null; then
          echo "Error: rotated credentials do not match the generated credentials" >&2
          exit 1
        fi

        echo "Rotated ${FILE} (client id unchanged)"
        echo "Once Flux has reconciled, Authelia and the ${APP} application Secret are updated automatically."
    requires:
      vars: [APP]
    preconditions: *client_preconditions
