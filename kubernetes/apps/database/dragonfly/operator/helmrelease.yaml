---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dragonfly-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # CRDs stay managed by the Kustomization (crd.yaml remote resource)
    # to avoid the Kustomization pruning them on first apply of this chart
    crds:
      install: false
    # Keep RBAC surface identical to the previous manual rbac.yaml
    createAggregateRoles: false
    rbacProxy:
      enabled: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
    manager:
      image:
        repository: ghcr.io/dragonflydb/operator
        tag: v1.7.0@sha256:3bfe011c73a0f642cc49808c34e2199ff378b08f2201e8bd134115706b39b9b1
      extraArgs:
        - --metrics-bind-address=:8080
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: *app
    serviceMonitor:
      enabled: true
      interval: 1m
      timeout: 10s
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: dragonfly-operator-controller-manager-metrics
              spec:
                fallbackScrapeProtocol: PrometheusText1.0.0
          - patch: |-
              - op: remove
                path: /spec/ports/0
              - op: add
                path: /spec/trafficDistribution
                value: PreferSameNode
            target:
              kind: Service
              name: dragonfly-operator-controller-svc
              namespace: database
