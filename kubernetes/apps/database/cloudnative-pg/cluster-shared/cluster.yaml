# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
metadata:
  name: cluster-shared
  annotations:
    # required for seamless bootstrap: https://github.com/cloudnative-pg/cloudnative-pg/issues/5778#issuecomment-2783417464
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
kind: Cluster
spec:
  affinity:
    podAntiAffinityType: "required"
  instances: 2
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    major: 18
    name: postgresql-minimal-trixie
  enableSuperuserAccess: true
  superuserSecret:
    name: pg-secret
  storage:
    size: 5Gi
    storageClass: local-hostpath
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 256Mi
      cpu: 50m
  postgresql:
    parameters:
      dynamic_shared_memory_type: sysv
      shared_buffers: 128MB
  bootstrap:
    recovery:
      source: cluster-shared-v1
      # recoveryTarget:
      #   targetTime: 2026-08-23T02:23:00Z
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cluster-shared-backup-local
        serverName: &currentServer cluster-shared-v2

  # Note: externalClusters is needed when recovering from an existing cnpg cluster
  externalClusters:
    - name: &recoveryServer cluster-shared-v1
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cluster-shared-backup-local
          serverName: *recoveryServer
