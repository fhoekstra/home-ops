---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: role-lldap
spec:
  cluster:
    name: cluster-shared
  name: lldap
  login: true
  passwordSecret:
    name: lldap-pg-secret
  connectionLimit: -1
  ensure: present
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: &app lldap
spec:
  name: *app
  owner: *app
  cluster:
    name: cluster-shared
  extensions: []
