---
# yaml-language-server: $schema=https://schemas.fluxoperator.dev/resourceset.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: instructions
spec:
  # Permute nests each provider's inputs under its normalized name
  # (instructions-site -> instructions_site), matching the operator's
  # gitless image automation guide
  inputStrategy:
    name: Permute
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: instructions-site
  commonMetadata:
    labels:
      app.kubernetes.io/name: instructions
  resources:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: instructions
        namespace: default
      spec:
        interval: 30m
        chartRef:
          kind: OCIRepository
          name: app-template
          namespace: flux-system
        install:
          remediation:
            retries: -1
        upgrade:
          cleanupOnFail: true
          remediation:
            retries: 3
        values:
          controllers:
            instructions:
              strategy: RollingUpdate
              containers:
                instructions:
                  image:
                    repository: ghcr.io/fhoekstra/instructions-site
                    tag: "<< inputs.instructions_site.tag >>@<< inputs.instructions_site.digest >>"
                  probes:
                    liveness: &probes
                      custom: true
                      spec:
                        httpGet:
                          path: /
                          port: 8080
                        initialDelaySeconds: 0
                        periodSeconds: 10
                        timeoutSeconds: 1
                        failureThreshold: 3
                    readiness: *probes
                  securityContext:
                    allowPrivilegeEscalation: false
                    privileged: false
                    readOnlyRootFilesystem: true
                    capabilities: { drop: ["ALL"] }
                  resources:
                    requests:
                      cpu: 10m
                    limits:
                      memory: 64Mi
          defaultPodOptions:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile: { type: RuntimeDefault }
          persistence:
            tmp:
              type: emptyDir
              medium: Memory
              globalMounts:
                - path: /tmp
          service:
            app:
              controller: instructions
              ports:
                http:
                  port: 8080
          route:
            app:
              hostnames: ["guide.${CLUSTER_DOMAIN}"]
              annotations:
                external-dns.kubernetes.io/target: "external.${CLUSTER_DOMAIN}"
              parentRefs:
                - name: envoy-external
                  namespace: network
                  sectionName: https
                - name: envoy-internal
                  namespace: network
                  sectionName: https
              rules:
                - backendRefs:
                    - identifier: app
                      port: http
