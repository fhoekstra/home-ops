---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: konflate

  values:
    # Values documentation: https://github.com/home-operations/konflate/tree/main/charts/konflate#readme
    # Default values file: https://raw.githubusercontent.com/home-operations/konflate/refs/heads/main/charts/konflate/values.yaml
    config:
      repo: github://fhoekstra/home-ops
      logFormat: json
      statusChecks: true
      prComments: true
      publicUrl: https://konflate.${CLUSTER_DOMAIN}
      extraEnv:
        - name: KONFLATE_BASE_PATH
          value: "/platform/konflate"

    ### Use experimental basepath support image
    image:
      repository: ghcr.io/fhoekstra/konflate
      pullPolicy: IfNotPresent
      tag: "basepath-1" # ARM64 only for now!!
      digest: "sha256:b6727e03c1af4188eb620cc3319f0feec28d67fab738649d002cc8e07decda09"

    # The upstream 0.5.0 chart does not know about config.basePath, so the custom
    # image serves the health/readiness endpoints under KONFLATE_BASE_PATH. Keep
    # the probes aligned with that prefix so Kubernetes sees the pod as Ready.
    livenessProbe:
      httpGet:
        path: /platform/konflate/healthz
        port: http
      initialDelaySeconds: 10
      periodSeconds: 20
    readinessProbe:
      httpGet:
        path: /platform/konflate/readyz
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10

    secret:
      existingSecret: konflate-secret

    resources:
      requests:
        cpu: 50m
      limits:
        cpu: 2
        memory: 2Gi

    httpRoute:
      enabled: true
      hostnames: ["konflate.${CLUSTER_DOMAIN}"]
      parentRefs:
        - name: envoy-internal
          namespace: network
      matches:
        - path:
            type: PathPrefix
            value: /platform/konflate

    persistence:
      enabled: true
      size: 2Gi

    monitoring:
      serviceMonitor:
        enabled: true
