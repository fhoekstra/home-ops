# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app k8s-gateway-kubes
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    serviceType: LoadBalancer
    servers:
      - zones:
          - zone: .
            use_tcp: true
        port: 53
        plugins:
          - name: k8s_gateway
            parameters: ${CLUSTER_DOMAIN} ${PERSONAL_DOMAIN}
            configBlock: |-
              apex dns
              ttl 1
              resources Ingress Service HTTPRoute
              fallthrough in-addr.arpa ip6.arpa
          - name: errors
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            parameters: 30
          - name: loop
          - name: reload
          - name: loadbalance
    service:
      annotations:
        lbipam.cilium.io/ips: "192.168.1.37"
      externalTrafficPolicy: Cluster
    resources:
      limits:
        memory: 32Mi
      requests:
        cpu: 5m
        memory: 32Mi
