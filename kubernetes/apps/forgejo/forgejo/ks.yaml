---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
  namespace: flux-system
spec:
  targetNamespace: forgejo
  components:
    - ../../../components/volsync/hot
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/forgejo/forgejo/app
  postBuild:
    substitute:
      APP: forgejo
      ANUBIS_TARGET: "http://forgejo-http.forgejo.svc:3000" # TODO: add Anubis
      VOLSYNC_CAPACITY: 20Gi
      NAMESPACE: forgejo
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
