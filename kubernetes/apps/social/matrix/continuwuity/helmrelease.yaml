---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app matrix-continuwuity
spec:
  interval: 30m
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      dnsConfig:
        nameservers:
          - "127.0.0.1"
        options:
          - name: ndots
            value: "1"
        searches:
          - cluster.local
      dnsPolicy: None
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    controllers:
      *app :
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          unbound:
            restartPolicy: Always
            image:
              repository: mirror.gcr.io/madnuttah/unbound
              tag: 1.25.1-3@sha256:1184c6210e56348ffdc446f31eb3108d6d0844ecfd18cf7081ca4ebe87ae8de8
            env:
              DISABLE_SET_PERMS: "true"
              HEALTHCHECK_PORT: "53"
              TZ: Europe/Paris
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: &probeDnsExec
                    command:
                      - /usr/local/unbound/sbin/healthcheck.sh
                  initialDelaySeconds: 15
                  periodSeconds: 60
                  timeoutSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *probeDnsExec
                  initialDelaySeconds: 2
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - NET_BIND_SERVICE
                drop:
                  - ALL
        containers:
          *app :
            image:
              repository: forgejo.ellis.link/continuwuation/continuwuity
              tag: v26.8.1-maxperf@sha256:19821bed098a4bef16682a112e2b249c1d87406a844f52617f5ced90f2be08f2
            env:
              CONTINUWUITY_LOG: "info"
              CONTINUWUITY_ADDRESS: "::"
              CONTINUWUITY_PORT: "8080"

              CONTINUWUITY_DATABASE_PATH: "/data/db"
              CONTINUWUITY_DATABASE_BACKUP_PATH: "/backups"
              CONTINUWUITY_DATABASE_BACKUPS_TO_KEEP: "3"

              CONTINUWUITY_ROCKSDB_COMPRESSION_ALGO: "zstd"
              CONTINUWUITY_ROCKSDB_COMPRESSION_LEVEL: "32767"
              CONTINUWUITY_ROCKSDB_BOTTOMMOST_COMPRESSION_LEVEL: "32767"
              CONTINUWUITY_ROCKSDB_BOTTOMMOST_COMPRESSION: "true"

              CONTINUWUITY_SERVER_NAME: "kubes.cloud"
              CONTINUWUITY_WELL_KNOWN__CLIENT: "https://m.kubes.cloud"
              CONTINUWUITY_WELL_KNOWN__SERVER: "m.kubes.cloud:443"

              # Security
              CONTINUWUITY_ALLOW_ENCRYPTION: "true"
              CONTINUWUITY_ALLOW_FEDERATION: "true"
              CONTINUWUITY_ALLOW_REGISTRATION: "false"
              CONTINUWUITY_SUSPEND_ON_REGISTER: "true"
              CONTINUWUITY_FORGET_FORCED_UPON_LEAVE: "true"
              CONTINUWUITY_REQUIRE_AUTH_FOR_PROFILE_REQUESTS: "true"
              CONTINUWUITY_ALLOW_PUBLIC_ROOM_DIRECTORY_WITHOUT_AUTH: "false"
              CONTINUWUITY_ALLOW_PUBLIC_ROOM_DIRECTORY_OVER_FEDERATION: "false"
              CONTINUWUITY_LOCKDOWN_PUBLIC_ROOM_DIRECTORY: "true"
              CONTINUWUITY_ALLOW_LEGACY_MEDIA: "false"
              CONTINUWUITY_MAX_REQUEST_SIZE: "20971520"

              # DNS
              CONTINUWUITY_QUERY_OVER_TCP_ONLY: "true" # Query DNS over TCP only: recommended in containers
              CONTINUWUITY_IP_LOOKUP_STRATEGY: "1" # Remove when IPv6 networking is added to my cluster
              CONTINUWUITY_DNS_TIMEOUT: "60" # Some home servers are on rather dynamic IPs which causes issues with old cache entries

              # Voice and video
              CONTINUWUITY_MATRIX_RTC__FOCI: '[{ type = "livekit", livekit_service_url = "https://livekit.kubes.cloud" }]'

              # Misc
              CONTINUWUITY_NEW_USER_DISPLAYNAME_SUFFIX: ""
              # CONTINUWUITY_FORBIDDEN_REMOTE_SERVER_NAMES: |
              #   ["matrix.org"]
              # CONTINUWUITY_FORBIDDEN_REMOTE_ROOM_DIRECTORY_SERVER_NAMES: |
              #   ["matrix.org"]
              # CONTINUWUITY_URL_PREVIEW_DOMAIN_EXPLICIT_DENYLIST: |
              #   ["matrix.org"]
              CONTINUWUITY_QUERY_TRUSTED_KEY_SERVERS_FIRST: false # NOTE: this is because continuwuity only supports Synapse as trusted key servers
              CONTINUWUITY_QUERY_TRUSTED_KEY_SERVERS_FIRST_ON_JOIN: false
            envFrom:
              - secretRef:
                  name: continuwuity
            resources:
              limits:
                cpu: 1
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 768Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            #   liveness: &probes
            #     enabled: false
            #     custom: true
            #     spec:
            #       httpGet:
            #         path: /_matrix/federation/v1/version
            #         port: http
            #       initialDelaySeconds: 0
            #       periodSeconds: 10
            #       timeoutSeconds: 1
            #       failureThreshold: 3
            #   readiness: *probes

    service:
      *app :
        controller: *app
        ports:
          http:
            port: &port 8080

    route:
      *app :
        hostnames:
          - m.kubes.cloud
        parentRefs: &gateways
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
      matrix-webfinger:
        annotations: # DNS for kubes.cloud. root is managed separately through an A record
          external-dns.alpha.kubernetes.io/controller: "ignore"
        hostnames:
          - kubes.cloud
        parentRefs: *gateways
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /.well-known/matrix
            backendRefs:
              - name: *app
                port: *port

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
            subPath: data
          - path: /backups
            subPath: backups
      tmp:
        type: emptyDir
      unbound:
        type: configMap
        name: unbound-configmap
        advancedMounts:
          *app :
            unbound:
              - path: /usr/local/unbound/unbound.conf
                subPath: unbound.conf
      unbound-iana:
        type: emptyDir
        advancedMounts:
          *app :
            unbound:
              - path: /usr/local/unbound/iana.d
