---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app matrix-ooye-bridge
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault

    controllers:
      *app :
        type: statefulset
        containers:
          *app :
            image:
              repository: ghcr.io/fhoekstra/out-of-your-element
              tag: v3.7-fix
            env:
              OOYE_DATADIR: /data
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

    service:
      *app :
        controller: *app
        publishNotReadyAddresses: true
        ports:
          http:
            port: &port 80
            targetPort: 6693

    route:
      *app :
        hostnames:
          - ooye.kubes.cloud
        parentRefs:
          # - name: envoy-external
          #   namespace: network
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
