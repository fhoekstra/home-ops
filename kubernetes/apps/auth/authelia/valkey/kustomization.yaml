---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./secret.sops.yaml
  - ./netpol-default.yaml
  - ./netpol-obs.yaml
configMapGenerator:
  - name: valkey-auth-config
    files:
      - valkey.conf=./config/valkey.conf
generatorOptions:
  disableNameSuffixHash: true
