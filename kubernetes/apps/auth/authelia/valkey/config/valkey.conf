# Valkey configuration for the Authelia session store.
# Managed by Flux, do not edit in-cluster.
# The requirepass directive is injected at container start from the
# valkey-auth-secret Secret, see helmrelease.yaml.

bind 0.0.0.0
port 6379
protected-mode yes

# Persistence: AOF (fsync every second) with periodic RDB snapshots as a second
# net. Sessions can have TTLs of up to 6 months (Authelia remember_me), so
# unlike the old Dragonfly instance this data must survive restarts.
appendonly yes
appendfsync everysec
appenddirname "appendonlydir"

save 900 1
save 300 100
save 60 10000
dbfilename dump.rdb

# Memory. Must stay below the container memory limit (512Mi) to leave headroom
# for fork() copy-on-write during AOF rewrites.
maxmemory 384mb
# Do not silently evict sessions when the memory limit is reached; fail writes
# instead so the problem is noticed.
maxmemory-policy noeviction

# Data location (volumeClaimTemplate, see helmrelease.yaml).
dir /data
