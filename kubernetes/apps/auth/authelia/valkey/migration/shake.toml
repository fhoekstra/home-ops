# RedisShake configuration: one-shot bulk import from Dragonfly to Valkey.
# Docs: https://tair-opensource.github.io/RedisShake/en/reader/scan_reader.html
#
# Any ${VAR} placeholder is substituted from the process environment when the
# config is loaded; unset variables stay literal and cause a loud auth failure.
# Passwords therefore come from Kubernetes Secrets (see job.yaml), never from
# this ConfigMap.
#
# scan_reader is the only mode that works with Dragonfly as the source: it
# cannot serve PSYNC/SYNC to a replication-based reader. It walks the source
# with SCAN, reads each key with DUMP + PTTL and writes it with RESTORE, so
# key types and TTLs are preserved.

[scan_reader]
cluster = false
address = "dragonfly-auth.auth.svc.cluster.local:6379"
password = "${SHAKE_SRC_PASSWORD}"
# Keys fetched per SCAN iteration. The default of 1 is far too slow for large
# keyspaces; 1000 moves 700k keys / 1.6GB in a couple of minutes.
count = 1000

[redis_writer]
cluster = false
address = "valkey-auth.auth.svc.cluster.local:6379"
password = "${SHAKE_DST_PASSWORD}"

[advanced]
dir = "/tmp/shake"
log_file = "shake.log"
log_rotation = false
# rewrite: re-running the job overwrites keys that already exist on the
# target, making re-runs after a partial failure idempotent. Only safe while
# Valkey is NOT yet serving live traffic - which is exactly the migration
# window this job runs in. The Kustomization is removed again in step 2.
rdb_restore_command_behavior = "rewrite"
pipeline_count_limit = 1024
