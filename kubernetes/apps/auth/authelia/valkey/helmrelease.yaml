---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app valkey-auth
spec:
  interval: 1h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      *app :
        type: statefulset
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        statefulset:
          # Retain the data PVC even if the StatefulSet is deleted, so an
          # accidental Helm uninstall cannot destroy the session store.
          persistentVolumeClaimRetentionPolicy:
            whenDeleted: Retain
            whenScaled: Retain
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 2Gi
              storageClass: ceph-block
              globalMounts:
                - path: /data
        containers:
          *app :
            image:
              repository: ghcr.io/valkey-io/valkey
              tag: 9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
            command: ["valkey-server"]
            # The password is injected as a CLI flag from the shared secret so
            # that Dragonfly and Valkey accept identical credentials during the
            # migration window (see MIGRATION.md).
            args: ["/config/valkey.conf", "--requirepass", "$(VALKEY_PASSWORD)"]
            env:
              VALKEY_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: valkey-auth-secret
                    key: AUTHELIA_SESSION_REDIS_PASSWORD
            probes:
              liveness: &mainProbes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/sh", "-c", "valkey-cli --no-auth-warning -a \"$VALKEY_PASSWORD\" ping | grep -q PONG"]
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *mainProbes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/sh", "-c", "valkey-cli --no-auth-warning -a \"$VALKEY_PASSWORD\" ping | grep -q PONG"]
                  periodSeconds: 2
                  timeoutSeconds: 2
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          exporter:
            image:
              repository: ghcr.io/oliver006/redis_exporter
              tag: v1.97.0@sha256:f5f903fbe77571d455ede0453b084d6840bc62fc105efac001034421cab83b99
            env:
              REDIS_ADDR: redis://localhost:6379
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: valkey-auth-secret
                    key: AUTHELIA_SESSION_REDIS_PASSWORD
            ports:
              - name: metrics
                containerPort: 9121
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 9121
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    service:
      *app :
        controller: *app
        ports:
          redis:
            port: 6379
          metrics:
            port: 9121
    serviceMonitor:
      valkey:
        serviceName: *app
        endpoints:
          - port: metrics
    persistence:
      config:
        type: configMap
        name: valkey-auth-config
        advancedMounts:
          *app :
            *app :
              - path: /config/valkey.conf
                subPath: valkey.conf
                readOnly: true
