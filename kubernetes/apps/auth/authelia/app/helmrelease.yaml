---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authelia
spec:
  interval: 1h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: "${APP}-anubis"
    - name: lldap
      namespace: auth
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      shareProcessNamespace: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: *app
    controllers:
      *app :
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
        containers:
          *app :
            image:
              repository: ghcr.io/authelia/authelia
              tag: 4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 128Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            envFrom:
              - secretRef:
                  name: authelia-secret
              - secretRef:
                  name: authelia-pg-secret
              - secretRef:
                  name: valkey-auth-secret
            env:
              X_AUTHELIA_CONFIG: "/config/configuration.yaml,/config/clients-config.yaml"
              X_AUTHELIA_CONFIG_FILTERS: template
              AUTHELIA_SERVER_ADDRESS: tcp://:8080
              AUTHELIA_SERVER_DISABLE_HEALTHCHECK: "true"
              AUTHELIA_TELEMETRY_METRICS_ADDRESS: tcp://:9959
              AUTHELIA_TELEMETRY_METRICS_ENABLED: "true"
              AUTHELIA_THEME: dark
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    service:
      *app :
        controller: *app
        ports:
          http:
            port: *port
          metrics:
            port: 9959
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: metrics
    route:
      *app :
        hostnames: ["auth.${CLUSTER_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: authelia-anubis
                port: 8080
            # # This is commented out because it is moved to ClientTrafficPolicy instead. Anubis requires X-Real-Ip header to be set.
            # filters:
            #   - type: RequestHeaderModifier
            #     requestHeaderModifier:
            #       set:
            #         - name: X-Real-Ip
            #           value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
    persistence:
      config:
        enabled: true
        type: configMap
        name: authelia-config
        advancedMounts:
          *app :
            *app :
              - path: /config/configuration.yaml
                subPath: configuration.yaml
                readOnly: true

      oidc-clients-config:
        type: configMap
        name: authelia-clients-config
        advancedMounts:
          *app :
            *app :
              - path: /config/clients-config.yaml
                subPath: configuration.yaml
                readOnly: true

      oidc-cert-jwk-rsa:
        enabled: true
        type: secret
        name: authelia-jwk-rsa
        advancedMounts:
          *app :
            *app :
              - path: /secrets/jwk-rsa
      oidc-cert-jwk-ecdsa:
        enabled: true
        type: secret
        name: authelia-jwk-ecdsa
        advancedMounts:
          *app :
            *app :
              - path: /secrets/jwk-ecdsa

      oidc-clients-secrets:
        type: secret
        name: authelia-oidc-clients
        advancedMounts:
          *app :
            *app :
              - path: /secrets/clients
