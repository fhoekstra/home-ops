---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: &name authelia-jwk-rsa
spec:
  dnsNames: ["auth.${CLUSTER_DOMAIN}"]
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-production
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  secretName: *name
  usages:
    - digital signature
    - key encipherment
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: &name authelia-jwk-ecdsa
spec:
  dnsNames: ["auth.${CLUSTER_DOMAIN}"]
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-production
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  secretName: *name
  usages:
    - digital signature
    - key encipherment
