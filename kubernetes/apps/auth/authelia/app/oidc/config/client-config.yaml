identity_providers:
  oidc:
    clients:
      - client_id: |-
          {{- fileContent "/secrets/clients/gotosocial.client-id" | nindent 10 }}
        client_name: GoToSocial at kubes.cloud (Mastodon-compatible Fediverse server)
        client_secret: |-
          {{- fileContent "/secrets/clients/gotosocial.client-secret-digest" | nindent 10 }}
        redirect_uris: ["https://gts.kubes.cloud/auth/callback"]
        scopes: [openid, profile, groups, email]
        claims_policy: gotosocial

      - client_id: |-
          {{- fileContent "/secrets/clients/continuwuity.client-id" | nindent 10 }}
        client_name: continuwuity at kubes.cloud (Matrix server)
        client_secret: |-
          {{- fileContent "/secrets/clients/continuwuity.client-secret-digest" | nindent 10 }}
        redirect_uris: ["https://m.kubes.cloud/_continuwuity/oidc/complete"]
        scopes: [openid]

      - client_id: |-
          {{- fileContent "/secrets/clients/forgejo.client-id" | nindent 10 }}
        client_name: Forgejo at git.kubes.cloud (Git forge)
        client_secret: |-
          {{- fileContent "/secrets/clients/forgejo.client-secret-digest" | nindent 10 }}
        redirect_uris: ["https://git.kubes.cloud/_forgejo/oidc/complete"]
        scopes: ["openid", "profile", "email", "groups"]

    claims_policies:
      gotosocial:
        id_token: ["preferred_username", "email", "email_verified", "groups"]
