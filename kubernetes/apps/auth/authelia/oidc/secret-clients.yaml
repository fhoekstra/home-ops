---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.0/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: authelia-oidc-clients-credentials
  labels:
    # Trigger a ResourceSet reconciliation when this Secret changes, so the
    # client secrets copied into application namespaces via `copyFrom` stay
    # in sync after `task oidc:rotate-client`.
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
# Individual clients are merged into this Secret by the SOPS-encrypted patch
# files in ./clients (see the patches list in kustomization.yaml), each adding
# `clients.<app>.client-id`, `clients.<app>.client-secret` and
# `clients.<app>.client-secret-digest` keys.
stringData: {}
