---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/fluxcd.controlplane.io/resourceset_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: authelia-oidc-clients
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  dependsOn:
    - # The combined OIDC client credentials Secret, assembled from the
      # SOPS-encrypted patch files in ./clients
      apiVersion: v1
      kind: Secret
      name: authelia-oidc-clients-credentials
      namespace: auth
    - # The declarative registry of OIDC clients
      apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: authelia-oidc-clients-inputs
      ready: true
  commonMetadata:
    labels:
      app.kubernetes.io/name: authelia
      app.kubernetes.io/component: oidc
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: authelia-oidc-clients-inputs
  # Generates, for each client in the inputs provider:
  #   1. A fragment of the Authelia `identity_providers.oidc` configuration in
  #      the authelia-oidc-clients-config ConfigMap. The fragment is a complete
  #      configuration section (including Authelia `{{ secret }}` calls for the
  #      client credentials) which Authelia loads as a second configuration
  #      file at startup (see the X_AUTHELIA_CONFIG env in the HelmRelease).
  #      The `{{ }}` delimiters pass through the ResourceSet template
  #      unharmed, because the ResourceSet template engine uses `<< >>`.
  #   2. A copy of the combined credentials Secret in the application's
  #      namespace, so the app can reference its own client_id/secret without
  #      cross-namespace secretKeyRefs.
  resourcesTemplate: |
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: authelia-oidc-clients-config
      namespace: auth
    data:
      clients.yaml: |
        # Generated by the authelia-oidc-clients ResourceSet. Do not edit.
        identity_providers:
          oidc:
            clients:
              <<- range $c := inputs.clients >>
              - client_id: {{ secret "/secrets/oidc/clients.<< $c.app >>.client-id" }}
                client_secret: {{ secret "/secrets/oidc/clients.<< $c.app >>.client-secret-digest" }}
                <<- $c.client | toYaml | trim | nindent 12 >>
              <<- end >>
            claims_policies:
              <<- range $c := inputs.clients >>
              <<- with $cp := get $c "claims_policies" >>
              <<- range $k, $v := $cp >>
              << $k >>:
                <<- $v | toYaml | trim | nindent 12 >>
              <<- end >>
              <<- end >>
              <<- end >>
    <<- range $c := inputs.clients >>
    ---
    apiVersion: v1
    kind: Secret
    metadata:
      name: authelia-oidc-<< $c.app >>-client
      namespace: << $c.namespace >>
      annotations:
        fluxcd.controlplane.io/copyFrom: auth/authelia-oidc-clients-credentials
    type: Opaque
    <<- end >>
