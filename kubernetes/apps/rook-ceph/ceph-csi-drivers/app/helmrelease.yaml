---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  interval: 1h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Rook-compatible values, see
    # https://github.com/rook/rook/blob/v1.20.10/deploy/charts/ceph-csi-drivers/values.yaml
    # The driver names must match the provisioner names used by Rook
    # (e.g. in StorageClasses and VolumeSnapshotClasses)
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        nodePlugin:
          priorityClassName: system-node-critical
        controllerPlugin:
          priorityClassName: system-cluster-critical
    drivers:
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        # Chart default is none, which would not deploy the csi-snapshotter
        # sidecar and break the csi-ceph-blockpool VolumeSnapshotClass
        snapshotPolicy: volumeSnapshot
        # Resource caps carried over from the old rook-ceph chart
        # csiRBDProvisionerResource values; the ceph-csi-drivers chart
        # sets no resources by default
        controllerPlugin:
          resources:
            plugin:
              requests:
                memory: 48Mi
                cpu: 15m
              limits:
                memory: 96Mi
                cpu: 200m
            provisioner:
              requests:
                memory: 16Mi
                cpu: 5m
              limits:
                memory: 32Mi
                cpu: 100m
            attacher:
              requests:
                memory: 32Mi
                cpu: 5m
              limits:
                memory: 64Mi
                cpu: 100m
            resizer:
              requests:
                memory: 48Mi
                cpu: 5m
              limits:
                memory: 96Mi
                cpu: 100m
            snapshotter:
              requests:
                memory: 16Mi
                cpu: 5m
              limits:
                memory: 32Mi
                cpu: 100m
        nodePlugin:
          resources:
            plugin:
              requests:
                memory: 64Mi
                cpu: 10m
              limits:
                memory: 192Mi
                cpu: 200m
            registrar:
              requests:
                memory: 64Mi
                cpu: 5m
              limits:
                memory: 128Mi
                cpu: 100m
      cephfs:
        enabled: false
        name: rook-ceph.cephfs.csi.ceph.com
      nfs:
        enabled: false
        name: rook-ceph.nfs.csi.ceph.com
      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com
