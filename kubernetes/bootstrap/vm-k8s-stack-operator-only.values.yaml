global:
  image:
    registry: mirror.gcr.io
  cluster:
    # -- K8s cluster domain suffix, uses for building storage pods' FQDN. Details are [here](https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/)
    dnsDomain: cluster.local.
fullnameOverride: vmetrics

crds:
  enabled: false

victoria-metrics-operator:
  enabled: true # Installed separately for now in vm-operator namespace
  crds:
    enabled: true
  operator:
    # -- Compare-options and sync-options for prometheus objects converted by operator for properly use with ArgoCD
    prometheus_converter_add_argocd_ignore_annotations: false
    # -- Enables ownership reference for converted prometheus-operator objects,
    # it will remove corresponding victoria-metrics objects in case of deletion prometheus one.
    enable_converter_ownership: true

defaultDashboards:
  enabled: false

defaultRules:
  enabled: false

alertmanager:
  enabled: false

vmalert:
  enabled: false

grafana:
  enabled: false

vmsingle:
  enabled: false

vmagent:
  enabled: false

prometheus-node-exporter:
  enabled: false

kube-state-metrics:
  enabled: false

kubeApiServer:
  enabled: false

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

coreDns:
  enabled: false
