---
apiVersion: config.talstomize.dev/v1alpha1
kind: Talstomize

# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.4

clusterName: kubernetes
controlPlaneEndpoint: https://192.168.1.30:6443
secrets: ./talos-secrets.sops.yaml

additionalSubjectAltNames:
  - "192.168.1.30"
  - "talos-rock-1"
  - "talos-rock-2"
  - "talos-rock-3"
  - "127.0.0.1"

# Shared Image Factory schematic for every node: Rock 5B+ overlay (SBC
# support) plus GPU/display and NIC firmware system extensions.
installer:
  # renovate: datasource=custom.talos-factory depName=siderolabs/talos
  talosVersion: v1.13.10
  schematic:
    overlay:
      image: siderolabs/sbc-rockchip
      name: rock5b-plus
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/panfrost
          - siderolabs/realtek-firmware
          - siderolabs/rockchip-rknn

nodes:
  talos-rock-1:
    ip: 192.168.1.21
    kind: controlplane
    patches:
      - ./patches/talos-rock-1/disk.yaml
      - ./patches/talos-rock-1/network.yaml
  talos-rock-2:
    ip: 192.168.1.22
    kind: controlplane
    patches:
      - ./patches/talos-rock-2/disk.yaml
      - ./patches/talos-rock-2/network.yaml
  talos-rock-3:
    ip: 192.168.1.23
    kind: controlplane
    patches:
      - ./patches/talos-rock-3/disk.yaml
      - ./patches/talos-rock-3/network.yaml

# Applied to every node, in the order listed (later patches override
# earlier ones): first the patches shared by every cluster (see ../patches),
# then this cluster's own.
patches:
  # Shared with every cluster
  - ../patches/all/machine-files.yaml
  - ../patches/all/machine-kubelet.yaml
  - ../patches/all/machine-network.yaml
  - ../patches/all/machine-sysctls.yaml
  - ../patches/all/machine-system-upgrade.yaml
  - ../patches/all/machine-time.yaml
  # This cluster only
  - ./patches/all/cluster-network.yaml
  - ./patches/all/kubelet-extra-mounts.yaml

# Applied to every controlplane node, before that node's own patches.
controlplanePatches:
  - ../patches/controlplane/admission-controller.yaml
  - ../patches/controlplane/cluster.yaml

workerPatches: []
