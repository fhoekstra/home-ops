apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  # talosctl get link --insecure -n <IP> [LINK_NAME -o yaml]
  match: glob("00:e0:4c:0b:07:4c", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 1500
addresses:
  - address: 192.168.1.21/24
routes:
  - gateway: 192.168.1.1
