---
apiVersion: config.talstomize.dev/v1alpha1
kind: Talstomize

# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.4

clusterName: kubernetes-rock5t
# TODO: adjust to the real VIP / API endpoint of this cluster
controlPlaneEndpoint: https://192.168.1.40:6443
secrets: ./talos-secrets.sops.yaml

additionalSubjectAltNames:
  - "192.168.1.40"
  - "talos-rock5t-1"
  - "127.0.0.1"

# Shared Image Factory schematic for every node: Rock 5T Plus overlay (SBC
# support) plus GPU/display and NIC firmware system extensions, and the
# ZFS and NFS server extensions for this cluster's storage workloads.
installer:
  # renovate: datasource=custom.talos-factory depName=siderolabs/talos
  talosVersion: v1.13.10
  schematic:
    overlay:
      image: siderolabs/sbc-rockchip
      name: rock5t-plus
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/panfrost
          - siderolabs/realtek-firmware
          - siderolabs/rockchip-rknn
          - siderolabs/zfs
          - siderolabs/nfsd

nodes:
  talos-rock5t-1:
    # TODO: adjust IP
    ip: 192.168.1.41
    kind: controlplane
    patches:
      - ./patches/talos-rock5t-1/disk.yaml
      - ./patches/talos-rock5t-1/network.yaml

# Applied to every node, in the order listed (later patches override
# earlier ones): first the patches shared by every cluster (see ../patches),
# then this cluster's own.
patches:
  # Shared with every cluster
  - ../patches/all/machine-files.yaml
  - ../patches/all/machine-kubelet.yaml
  - ../patches/all/machine-network.yaml
  - ../patches/all/machine-sysctls.yaml
  - ../patches/all/machine-system-upgrade.yaml
  - ../patches/all/machine-time.yaml
  # This cluster only
  - ./patches/all/cluster-network.yaml

# Applied to every controlplane node, before that node's own patches.
controlplanePatches:
  - ../patches/controlplane/admission-controller.yaml
  - ../patches/controlplane/cluster.yaml

workerPatches: []
