apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  # TODO: real MAC, discover with: talosctl get link --insecure -n <IP> [LINK_NAME -o yaml]
  match: glob("00:e0:4c:AA:AA:01", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 1500
addresses:
  - address: 192.168.1.41/24
routes:
  - gateway: 192.168.1.1
