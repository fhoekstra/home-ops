---
# renovate: datasource=custom.talos-factory depName=siderolabs/talos
talosVersion: v1.13.10
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.4

clusterName: kubernetes
clusterEndpoint: https://192.168.1.30:6443

# Rock 5B+ board overlay + extensions, see schematic-rock-5b-plus.yaml.
# The schematic ID is computed locally by topf from the file.
schematicId: "@schematic-rock-5b-plus.yaml"

patchesDir: patches
secretsPath: secrets.sops.yaml

nodes:
  - host: talos-rock-1
    ip: 192.168.1.21
    role: control-plane
  - host: talos-rock-2
    ip: 192.168.1.22
    role: control-plane
  - host: talos-rock-3
    ip: 192.168.1.23
    role: control-plane
