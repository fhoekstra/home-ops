---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

set: [pipefail]
shopt: [globstar]

vars:
  KUBERNETES_DIR: "{{.ROOT_DIR}}/kubernetes"
  PRIVATE_DIR: "{{.ROOT_DIR}}/.private"
  # Which Talos cluster to operate on; override with CLUSTER=<name>, e.g.
  # `task talos:apply CLUSTER=kubernetes-rock5t`. One directory per cluster
  # under kubernetes/bootstrap/talos/, named after its clusterName.
  CLUSTER: '{{.CLUSTER | default "kubernetes"}}'
  TALOS_DIR: "{{.ROOT_DIR}}/kubernetes/bootstrap/talos/{{.CLUSTER}}"
  TALOSCONFIG: "{{.TALOS_DIR}}/clusterconfig/talosconfig"

env:
  KUBECONFIG: "{{.ROOT_DIR}}/kubeconfig"
  SOPS_AGE_KEY_FILE: "{{.ROOT_DIR}}/age-pq.key"
  TALOSCONFIG: "{{.TALOSCONFIG}}"

includes:
  bootstrap: .taskfiles/bootstrap
  talos: .taskfiles/talos
  kubernetes: .taskfiles/kubernetes
  sops: .taskfiles/sops

tasks:
  default: task --list

  reconcile:
    desc: Force Flux to pull in changes from your Git repository
    cmd: flux --namespace flux-system reconcile kustomization flux-system --with-source
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which flux

  flate:
    desc: Run flate to check correctness
    cmd: flate test all --path kubernetes/flux/cluster
    preconditions:
      - sh: which flate
        msg: "Install flate with: brew install --cask home-operations/tap/flate"
